# OpenRouter. API key comes from the OPENROUTER_API_KEY env var, never this file.
base_url: https://openrouter.ai/api/v1

models:
  # All three verified against https://openrouter.ai/models with a live call.
  # A wrong slug returns 404 'No endpoints found' on the first request.
  writer: anthropic/claude-opus-4.1      # long-form doc generation (verified)
  research: perplexity/sonar             # web search pass (verified)
  checker: anthropic/claude-sonnet-4.5   # self-check pass (verified)

# Paths
corpus_ppts: corpus/ppts
corpus_tr_docs: corpus/tr_docs
style_guide: style-guide.md
baseline: baseline.md    # hand-written student knowledge baseline

# Worked exemplars: TR docs whose TEACHING the writer should imitate. Sent on
# every write call, so keep the folder small -- one strong exemplar beats three
# mediocre ones. Set to "" to skip them.
exemplars: reference
work_dir: work
out_dir: out

# A full TR doc is long -- the reference doc this was calibrated against is
# ~1,700 lines / ~21k output tokens. Without an explicit cap the provider
# default applies and the doc comes back thin.
max_output_tokens: 32000

# Snippet execution (Rule 5)
run_timeout_seconds: 30

# Execute the model's offline Python to capture real output. True is right on
# your own machine. The Streamlit app ignores this and decides for itself: it
# executes nothing unless TR_LOCAL=1 is set, so a hosted deployment never runs
# generated code.
execute_snippets: true
